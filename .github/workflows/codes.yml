name: Update codes and events

# 웹앱(apps.sumi.kr/genshin-codes/)의 리딤 코드·이벤트 목록(checkin/data/codes.json, events.json)을 만든다.
# 새 코드가 생기면 웹앱에서 알림을 켠 기기에 웹 푸시(OneSignal)를 한 번 보낸다. 바뀐 게 있을 때만 커밋한다.
on:
  schedule:
    # 1시간마다(정각을 피해 41분).
    - cron: "41 * * * *"
    # 금요일 밤 특별 방송 시간대(한국 시간 밤 9시~새벽 1시, UTC 12~16시)에는 15분마다.
    - cron: "*/15 12-16 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# 겹쳐 돌면 같은 새 코드로 알림이 두 번 갈 수 있어 한 번에 하나만 돈다.
concurrency:
  group: codes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 수동 실행할 때만: 알림 키가 맞는지 읽기 전용 요청으로 확인한다(알림은 보내지 않는다. 키는 출력하지 않는다).
      - name: Check OneSignal key
        if: github.event_name == 'workflow_dispatch'
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          if [ -z "$ONESIGNAL_API_KEY" ]; then echo "ONESIGNAL_API_KEY 없음"; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Key $ONESIGNAL_API_KEY" \
            "https://api.onesignal.com/notifications?app_id=b45e38a4-bb0d-44c2-8d58-33869fde35c8&limit=1")
          echo "OneSignal 키 확인: HTTP $code"

      - name: Build codes.json and events.json
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python3 tools/update_codes.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- checkin/data)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkin/data
          git commit -m "Update codes and events"
          # 복각표 작업이 먼저 커밋했을 수 있어 받아서 올린다.
          git pull --rebase -q origin main
          git push

      # 혹시 멈췄다가 다시 켠 경우를 대비해, 돌 때마다 이 작업을 '켜짐'으로 확인해 둔다(복각표 작업과 같은 방식).
      - name: Make sure the schedule stays enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/codes.yml/enable" || true
