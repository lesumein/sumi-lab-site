name: Update rerun data

# 원신 출첵 앱의 '복각표' 데이터(checkin/data/reruns.json)를 하루 한 번 위키에서 다시 만든다.
# 바뀐 게 있을 때만 커밋하고, GitHub Pages가 apps.sumi.kr/checkin/data/reruns.json으로 내보낸다.
on:
  schedule:
    # 매일 한국 시간 오전 5시 17분(UTC 20:17). 정각을 피해 붐비는 시간을 비킨다.
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build reruns.json
        run: python3 tools/update_reruns.py

      # GitHub은 공개 저장소에 60일 동안 활동이 없으면 예약 작업을 멈춘다. 자료가 오래 안 바뀌어도 멈추지 않게,
      # 마지막 커밋이 30일보다 오래됐으면 확인 날짜만 적은 작은 파일을 고쳐 커밋한다(평소엔 커밋하지 않는다).
      - name: Keep alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%F > checkin/data/last-check.txt
          fi

      - name: Commit if changed
        run: |
          if git diff --quiet -- checkin/data && [ -z "$(git status --porcelain -- checkin/data)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checkin/data
          git commit -m "Update rerun data"
          git push

      # 혹시 멈췄다가 사람이 다시 켠 경우를 대비해, 돌 때마다 이 작업을 '켜짐'으로 확인해 둔다.
      - name: Make sure the schedule stays enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reruns.yml/enable" || true
